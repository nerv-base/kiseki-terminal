<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 212" width="880" height="212" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D22"/>
      <stop offset="52%" stop-color="#11132E"/>
      <stop offset="100%" stop-color="#1A0E24"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.18" cy="0.52" r="0.38">
      <stop offset="0%" stop-color="#66F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#66F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.82" cy="0.36" r="0.44">
      <stop offset="0%" stop-color="#FF82B8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF82B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="212" y1="54" x2="660" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#66F0FF"/>
      <stop offset="48%" stop-color="#F2F6FF"/>
      <stop offset="100%" stop-color="#FF82B8"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#66F0FF"/>
      <stop offset="33%" stop-color="#D8262E"/>
      <stop offset="66%" stop-color="#5CE6D0"/>
      <stop offset="100%" stop-color="#FF9EC7"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="880" height="212" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="880" height="212" fill="url(#bg)"/>
    <rect width="880" height="212" fill="url(#glowCyan)"/>
    <rect width="880" height="212" fill="url(#glowPink)"/>

    <!-- Subtle retro CRT horizontal scanlines -->
    <g fill="#FFFFFF" fill-opacity="0.02" shape-rendering="crispEdges">
      <rect y="12" width="880" height="2"/><rect y="24" width="880" height="2"/><rect y="36" width="880" height="2"/>
      <rect y="48" width="880" height="2"/><rect y="60" width="880" height="2"/><rect y="72" width="880" height="2"/>
      <rect y="84" width="880" height="2"/><rect y="96" width="880" height="2"/><rect y="108" width="880" height="2"/>
      <rect y="120" width="880" height="2"/><rect y="132" width="880" height="2"/><rect y="144" width="880" height="2"/>
      <rect y="156" width="880" height="2"/><rect y="168" width="880" height="2"/><rect y="180" width="880" height="2"/>
      <rect y="192" width="880" height="2"/>
    </g>

    <!-- 8-bit pixel stars & diagonal pixel shooting star on right sky -->
    <g shape-rendering="crispEdges">
      <!-- Twinkling pixel stars -->
      <rect x="742" y="34" width="4" height="4" fill="#66F0FF" fill-opacity="0.85"/>
      <rect x="796" y="28" width="3" height="3" fill="#FF82B8" fill-opacity="0.8"/>
      <rect x="844" y="64" width="4" height="4" fill="#B48EFE" fill-opacity="0.75"/>
      <rect x="718" y="88" width="3" height="3" fill="#FFD580" fill-opacity="0.7"/>
      <rect x="822" y="136" width="3" height="3" fill="#66F0FF" fill-opacity="0.65"/>
      <rect x="760" y="156" width="4" height="4" fill="#FF9EC7" fill-opacity="0.6"/>
      <!-- 4-point pixel sparkle -->
      <rect x="814" y="42" width="3" height="15" fill="#FFE5A3"/>
      <rect x="808" y="48" width="15" height="3" fill="#FFE5A3"/>
      <rect x="811" y="45" width="9" height="9" fill="#FFF8DC"/>
      <rect x="814" y="48" width="3" height="3" fill="#FFFFFF"/>
      <!-- Pixel diagonal meteor tail (stair-stepped) -->
      <rect x="798" y="60" width="8" height="4" fill="#66F0FF" fill-opacity="0.82"/>
      <rect x="786" y="68" width="10" height="4" fill="#66F0FF" fill-opacity="0.65"/>
      <rect x="772" y="76" width="12" height="4" fill="#7AA2F7" fill-opacity="0.50"/>
      <rect x="756" y="84" width="14" height="4" fill="#B48EFE" fill-opacity="0.36"/>
      <rect x="738" y="92" width="14" height="4" fill="#FF82B8" fill-opacity="0.24"/>
      <rect x="720" y="100" width="12" height="4" fill="#FF82B8" fill-opacity="0.14"/>
      <!-- Subtle pixel dither strip near bottom -->
      <rect x="700" y="198" width="6" height="4" fill="#66F0FF" fill-opacity="0.18"/>
      <rect x="712" y="198" width="6" height="4" fill="#B48EFE" fill-opacity="0.18"/>
      <rect x="724" y="198" width="6" height="4" fill="#FF82B8" fill-opacity="0.18"/>
      <rect x="736" y="198" width="6" height="4" fill="#FFD580" fill-opacity="0.18"/>
      <rect x="748" y="198" width="6" height="4" fill="#66F0FF" fill-opacity="0.18"/>
      <rect x="760" y="198" width="6" height="4" fill="#B48EFE" fill-opacity="0.18"/>
      <rect x="772" y="198" width="6" height="4" fill="#FF82B8" fill-opacity="0.18"/>
      <rect x="784" y="198" width="6" height="4" fill="#FFD580" fill-opacity="0.18"/>
      <rect x="796" y="198" width="6" height="4" fill="#66F0FF" fill-opacity="0.18"/>
      <rect x="808" y="198" width="6" height="4" fill="#B48EFE" fill-opacity="0.18"/>
      <rect x="820" y="198" width="6" height="4" fill="#FF82B8" fill-opacity="0.18"/>
      <rect x="832" y="198" width="6" height="4" fill="#FFD580" fill-opacity="0.18"/>
    </g>

    <!-- Option B: 8-Bit Pixel Window Logo (4x integer scale = 128x128) -->
    <g transform="translate(46, 40) scale(4)" shape-rendering="crispEdges">
      <rect x="4" y="4" width="26" height="26" fill="#FF82B8" fill-opacity="0.34"/>
      <rect x="2" y="2" width="26" height="26" fill="#66F0FF" fill-opacity="0.28"/>
      <rect x="3" y="3" width="26" height="26" fill="#0A0F25"/>
      <rect x="4" y="2" width="24" height="1" fill="#7AA2F7"/>
      <rect x="4" y="29" width="24" height="1" fill="#7AA2F7"/>
      <rect x="2" y="4" width="1" height="24" fill="#7AA2F7"/>
      <rect x="29" y="4" width="1" height="24" fill="#7AA2F7"/>
      <rect x="3" y="3" width="1" height="1" fill="#66F0FF"/>
      <rect x="28" y="3" width="1" height="1" fill="#FF82B8"/>
      <rect x="3" y="28" width="1" height="1" fill="#66F0FF"/>
      <rect x="28" y="28" width="1" height="1" fill="#FF82B8"/>
      <rect x="4" y="4" width="24" height="4" fill="#172046"/>
      <rect x="5" y="5" width="2" height="2" fill="#FF6B8B"/>
      <rect x="8" y="5" width="2" height="2" fill="#FFD580"/>
      <rect x="11" y="5" width="2" height="2" fill="#72F1B8"/>
      <rect x="4" y="8" width="24" height="1" fill="#2A376E"/>
      <rect x="7" y="13" width="2" height="2" fill="#66F0FF"/>
      <rect x="9" y="15" width="2" height="2" fill="#66F0FF"/>
      <rect x="11" y="17" width="2" height="2" fill="#99F7FF"/>
      <rect x="9" y="19" width="2" height="2" fill="#66F0FF"/>
      <rect x="7" y="21" width="2" height="2" fill="#66F0FF"/>
      <rect x="14" y="21" width="6" height="2" fill="#FF82B8"/>
      <rect x="22" y="11" width="1" height="5" fill="#FFE5A3"/>
      <rect x="20" y="13" width="5" height="1" fill="#FFE5A3"/>
      <rect x="21" y="12" width="3" height="3" fill="#FFF8DC"/>
      <rect x="22" y="13" width="1" height="1" fill="#FFFFFF"/>
      <rect x="17" y="11" width="1" height="1" fill="#FF82B8"/>
      <rect x="25" y="17" width="1" height="1" fill="#66F0FF"/>
      <rect x="23" y="22" width="2" height="2" fill="#B48EFE"/>
      <rect x="5" y="26" width="22" height="1" fill="#1D2754"/>
    </g>

    <!-- Title lockup with subtle retro pixel chromatic drop shadow -->
    <text x="212" y="96" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="3.5" fill="#FF82B8" fill-opacity="0.32">KISEKI TERMINAL</text>
    <text x="210" y="94" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="3.5" fill="url(#titleGrad)">KISEKI TERMINAL</text>

    <!-- Bilingual subtitle -->
    <text x="212" y="126" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="15.5" font-weight="500" fill="#B8C4EC">二次元美学 Windows Terminal 主题合集 · 60fps GPU Live Shaders</text>

    <!-- 4-theme crisp pills -->
    <g transform="translate(212, 146)" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="128" height="25" rx="6" fill="#131D42" stroke="#66F0FF" stroke-opacity="0.6"/>
      <rect x="10" y="9" width="7" height="7" fill="#66F0FF" shape-rendering="crispEdges"/>
      <text x="24" y="16.5" fill="#DDF8FF">starlight-8bit</text>

      <rect x="138" y="0" width="96" height="25" rx="6" fill="#221013" stroke="#D8262E" stroke-opacity="0.72"/>
      <rect x="148" y="9" width="7" height="7" fill="#F06A22" shape-rendering="crispEdges"/>
      <text x="162" y="16.5" fill="#FFE6DC">nerv-eva</text>

      <rect x="244" y="0" width="118" height="25" rx="6" fill="#102430" stroke="#5CE6D0" stroke-opacity="0.6"/>
      <rect x="254" y="9" width="7" height="7" fill="#5CE6D0" shape-rendering="crispEdges"/>
      <text x="268" y="16.5" fill="#D8FFF8">shinkai-rain</text>

      <rect x="372" y="0" width="122" height="25" rx="6" fill="#21142E" stroke="#FF9EC7" stroke-opacity="0.6"/>
      <rect x="382" y="9" width="7" height="7" fill="#FF9EC7" shape-rendering="crispEdges"/>
      <text x="396" y="16.5" fill="#FFE6F2">kyoto-sakura</text>
    </g>

    <!-- 4-theme bottom pixel accent bar -->
    <rect x="0" y="208" width="880" height="4" fill="url(#stripe)" opacity="0.9"/>
  </g>

  <!-- Crisp outer hairline -->
  <rect x="0.75" y="0.75" width="878.5" height="210.5" rx="13.5" stroke="#7AA2F7" stroke-opacity="0.28" stroke-width="1.5"/>
