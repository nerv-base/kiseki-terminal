name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static entry check (fork-safe)
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-submission.mjs
      - name: Run registry unit tests
        run: node --test scripts/*.test.mjs
