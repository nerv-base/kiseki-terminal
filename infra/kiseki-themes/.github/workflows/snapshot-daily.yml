name: Daily metrics snapshot

on:
  schedule:
    - cron: '7 0 * * *' # Daily at 00:07 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: data/stars.json
          key: stars-v1-snapshot
          restore-keys: stars-v1-
      - uses: actions/cache/restore@v4
        with:
          path: data/downloads.json
          key: downloads-v1-snapshot
          restore-keys: downloads-v1-
      - name: Write daily snapshot for 7d star delta & trend math
        run: |
          node - <<'EOF'
          const fs = require('node:fs');
          const stars = fs.existsSync('data/stars.json') ? JSON.parse(fs.readFileSync('data/stars.json', 'utf8')) : {};
          const dl = fs.existsSync('data/downloads.json') ? JSON.parse(fs.readFileSync('data/downloads.json', 'utf8')) : {};
          const snap = {};
          for (const id of new Set([...Object.keys(stars), ...Object.keys(dl)])) {
            snap[id] = {
              stars: stars[id]?.stars ?? 0,
              downloads: typeof dl[id] === 'number' ? dl[id] : (dl[id]?.total ?? 0),
            };
          }
          const today = new Date().toISOString().slice(0, 10);
          fs.mkdirSync('snapshots', { recursive: true });
          fs.writeFileSync(`snapshots/${today}.json`, JSON.stringify(snap, null, 2) + '\n');
          EOF
      - name: Commit snapshot
        run: |
          if [ -n "$(git status --porcelain snapshots/)" ]; then
            git config user.name "kiseki-bot"
            git config user.email "bot@kisekiterm.dev"
            git add snapshots/
            git commit -m "chore: daily gallery metrics snapshot"
            git push
          fi
