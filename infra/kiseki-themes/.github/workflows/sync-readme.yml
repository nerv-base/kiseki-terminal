name: Sync READMEs from data/themes

on:
  push:
    branches: [main]
    paths:
      - 'data/themes/*.yml'
      - 'scripts/generate-readme.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-readme.mjs
      - name: Commit updated README if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "kiseki-bot"
            git config user.email "bot@kisekiterm.dev"
            git add README.md
            git commit -m "chore: regenerate theme listing"
            git push
          fi
