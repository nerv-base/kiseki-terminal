name: Weekly decay scan

on:
  schedule:
    - cron: '41 3 * * 1' # Mondays, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: decay-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan for deleted or archived theme repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/scan-decay.mjs
