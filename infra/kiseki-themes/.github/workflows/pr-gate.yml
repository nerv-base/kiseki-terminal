name: Submission gate

# Trusted-code PR validation gate (adapted from awesome-dsh-plugin).
# SECURITY: Checks out ONLY the base repository's default branch. Changed YAML
# files from the PR are extracted strictly as data into a scratch directory and
# validated against the target repo using the official `kiseki` binary.

on:
  workflow_run:
    workflows: ['PR check']
    types: [completed]

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve open pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const head = `${run.head_repository.owner.login}:${run.head_branch}`;
            const { data } = await github.rest.pulls.list({ owner, repo, state: 'open', head, per_page: 10 });
            const pr = data.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('number', String(pr.number));

      - uses: actions/checkout@v4
        if: steps.pr.outputs.found == 'true'

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.found == 'true'
        with:
          node-version: 22

      - name: Extract changed YAML entries as pure data
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const pull_number = Number('${{ steps.pr.outputs.number }}');
            const headSha = '${{ github.event.workflow_run.head_sha }}';
            const outDir = '/tmp/kiseki-pr-entries';
            fs.rmSync(outDir, { recursive: true, force: true });
            fs.mkdirSync(outDir, { recursive: true });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            for (const f of files) {
              if (f.status === 'removed') continue;
              if (!f.filename.startsWith('data/themes/') || !f.filename.endsWith('.yml')) continue;
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: f.filename, ref: headSha,
              });
              if (data && 'content' in data) {
                const buf = Buffer.from(data.content, 'base64');
                fs.writeFileSync(path.join(outDir, path.basename(f.filename)), buf);
              }
            }

      - name: Install latest Kiseki validator binary
        if: steps.pr.outputs.found == 'true'
        run: |
          curl -fsSL https://dl.kisekiterm.dev/install.sh | sh -s -- --skip-fonts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.config/kiseki/bin" >> "$GITHUB_PATH"

      - name: Validate submitted themes with `kiseki theme validate`
        if: steps.pr.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gate-submission.mjs --entries-dir /tmp/kiseki-pr-entries
