name: Deploy Site

on:
  push:
    branches: ["main", "v2"]
    paths:
      - "site/**"
      - "themes/**"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Sync themes & build site
        working-directory: site
        run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  sync-r2-scripts:
    name: Sync installer scripts to R2 (dl.kisekiterm.dev / EdgeOne)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upload install.sh and install.ps1 to R2 root
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Cloudflare R2 secrets not set; skipping installer script sync."
            exit 0
          fi
          for s in scripts/install.sh scripts/install.ps1; do
            name="$(basename "$s")"
            npx --yes wrangler@4 r2 object put "kiseki-dl/${name}" \
              --file "$s" --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=60" --remote
          done
