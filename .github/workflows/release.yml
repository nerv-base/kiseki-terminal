name: Release

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0-alpha.1 or v2.0.0)"
        required: true
        type: string
      draft:
        description: "Keep GitHub Release as draft"
        required: false
        default: true
        type: boolean
      publish_brew:
        description: "Update Formula/kiseki.rb in nerv-base/homebrew-tap"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      publish_brew: ${{ steps.meta.outputs.publish_brew }}
    steps:
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            DRAFT="${{ inputs.draft }}"
            PUBLISH_BREW="${{ inputs.publish_brew }}"
          else
            TAG="${GITHUB_REF_NAME}"
            DRAFT="false"
            PUBLISH_BREW="auto"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          if [ "$PUBLISH_BREW" = "auto" ]; then
            if [ "$PRERELEASE" = "true" ]; then
              PUBLISH_BREW="false"
            else
              PUBLISH_BREW="true"
            fi
          fi
          printf '%s\n' \
            "tag=${TAG}" \
            "version=${VERSION}" \
            "prerelease=${PRERELEASE}" \
            "draft=${DRAFT}" \
            "publish_brew=${PUBLISH_BREW}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: kiseki
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: kiseki
            archive_ext: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: kiseki
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            bin: kiseki
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: kiseki.exe
            archive_ext: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            bin: kiseki.exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p kiseki-cli --target ${{ matrix.target }}

      - name: Sign and notarize macOS binary
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ -z "${MACOS_CERTIFICATE:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::notice::MACOS_CERTIFICATE not available; skipping Developer ID code signing and notarization."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/kiseki-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          KEYCHAINS=("$KEYCHAIN")
          while IFS='"' read -r _ existing _; do
            if [ -n "$existing" ]; then KEYCHAINS+=("$existing"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' signing identity found in imported certificate."
            exit 1
          fi
          echo "Signing $BIN with $IDENTITY..."
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ]; then
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            NOTARY_ZIP="$RUNNER_TEMP/kiseki-${{ matrix.target }}-notary.zip"
            ditto -c -k --keepParent "$BIN" "$NOTARY_ZIP"
            NOTARY_ARGS=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --wait)
            if [ -n "${APPLE_API_ISSUER:-}" ]; then
              NOTARY_ARGS+=(--issuer "$APPLE_API_ISSUER")
            fi
            echo "Submitting $NOTARY_ZIP to Apple notary service..."
            NOTARY_OUT="$RUNNER_TEMP/notary-result.json"
            xcrun notarytool submit "$NOTARY_ZIP" "${NOTARY_ARGS[@]}" --output-format json > "$NOTARY_OUT"
            cat "$NOTARY_OUT"
            STATUS="$(python3 -c "import json; print(json.load(open('$NOTARY_OUT')).get('status', ''))")"
            SUB_ID="$(python3 -c "import json; print(json.load(open('$NOTARY_OUT')).get('id', ''))")"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Apple notarization status was '$STATUS' (id=$SUB_ID)"
              if [ -n "$SUB_ID" ]; then
                xcrun notarytool log "$SUB_ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" ${APPLE_API_ISSUER:+--issuer "$APPLE_API_ISSUER"} || true
              fi
              rm -f "$RUNNER_TEMP/AuthKey.p8" "$NOTARY_ZIP" "$NOTARY_OUT"
              exit 1
            fi
            rm -f "$RUNNER_TEMP/AuthKey.p8" "$NOTARY_ZIP" "$NOTARY_OUT"
            echo "✓ Signed and notarized $BIN (submission $SUB_ID)"
          else
            echo "::notice::APPLE_API_KEY / APPLE_API_KEY_ID not set; binary is Developer ID signed but not notarized."
          fi

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/kiseki-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/kiseki-"*-notary.zip

      - name: Smoke test native binary
        if: |
          matrix.target == 'aarch64-apple-darwin' ||
          matrix.target == 'x86_64-unknown-linux-musl' ||
          matrix.target == 'aarch64-unknown-linux-musl' ||
          matrix.target == 'x86_64-pc-windows-msvc' ||
          matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: "./target/${{ matrix.target }}/release/${{ matrix.bin }} --version"

      - name: Package Unix archive (.tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          PKG="kiseki-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/archives" "dist/stage/${PKG}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/stage/${PKG}/${{ matrix.bin }}"
          chmod +x "dist/stage/${PKG}/${{ matrix.bin }}"
          cp README.md LICENSE "dist/stage/${PKG}/"
          cp crates/kiseki-compiler/assets/zsh/NOTICE "dist/stage/${PKG}/"
          for plugin in zsh-syntax-highlighting zsh-autosuggestions; do
            cp "crates/kiseki-compiler/assets/zsh/$plugin/LICENSE" "dist/stage/${PKG}/LICENSE.$plugin"
          done
          tar -C dist/stage -czf "dist/archives/${PKG}.tar.gz" "${PKG}"

      - name: Package Windows archive (.zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $target = "${{ matrix.target }}"
          $pkg = "kiseki-$tag-$target"
          New-Item -ItemType Directory -Force -Path "dist/archives", "dist/stage/$pkg" | Out-Null
          Copy-Item "target/$target/release/${{ matrix.bin }}" "dist/stage/$pkg/${{ matrix.bin }}"
          Copy-Item README.md, LICENSE, crates/kiseki-compiler/assets/zsh/NOTICE "dist/stage/$pkg/"
          foreach ($plugin in 'zsh-syntax-highlighting', 'zsh-autosuggestions') {
            Copy-Item "crates/kiseki-compiler/assets/zsh/$plugin/LICENSE" "dist/stage/$pkg/LICENSE.$plugin"
          }
          Compress-Archive -Path "dist/stage/$pkg" -DestinationPath "dist/archives/$pkg.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/archives/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release & Manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist/archives
          merge-multiple: true

      - name: Render dependency manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/render-deps.mjs --out dist/deps.tsv

      - name: Generate SHA-256 checksums
        run: |
          cd dist/archives
          sha256sum kiseki-* | sort -k2 > checksums.txt
          sha256sum ../deps.tsv | awk '{print $1 "  deps.tsv"}' >> checksums.txt
          cat checksums.txt

      - name: Render Homebrew formula and stage release manifests
        run: |
          mkdir -p dist/manifests
          node scripts/release/render-manifests.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --checksums dist/archives/checksums.txt \
            --brew-out dist/manifests/kiseki.rb \
            --repo "${{ github.repository }}"
          ruby -c dist/manifests/kiseki.rb
          cp dist/archives/checksums.txt dist/deps.tsv dist/manifests/

      - name: Upload manifests artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: dist/manifests/
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          DRAFT="${{ needs.prepare.outputs.draft }}"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          SHA="${{ github.sha }}"

          cat > dist/RELEASE_NOTES.md <<EOF
          <p align="center">
            <img src="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/assets/hero-v2.png" alt="Kiseki Terminal v2" width="100%" />
          </p>

          ## Install

          - **Homebrew (macOS / Linux)**: \`brew install nerv-base/tap/kiseki\`
          - **Shell (macOS / Linux)**: \`curl -fsSL https://kisekiterm.dev/install.sh | KISEKI_VERSION=${TAG} sh\`
          - **PowerShell (Windows)**: \`& ([scriptblock]::Create((irm https://kisekiterm.dev/install.ps1))) -Version ${TAG}\`

          ### SHA-256 Checksums
          \`\`\`
          $(cat dist/archives/checksums.txt)
          \`\`\`
          EOF

          ASSETS=(
            dist/archives/kiseki-*
            dist/archives/checksums.txt
            dist/manifests/kiseki.rb
            dist/deps.tsv
            scripts/install.sh
            scripts/install.ps1
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
            if [ "$DRAFT" = "false" ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            FLAGS=(--title "${TAG} — Kiseki Terminal v2" --notes-file dist/RELEASE_NOTES.md --target "${{ github.ref_name }}")
            if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "${FLAGS[@]}" "${ASSETS[@]}"
          fi

  publish-homebrew:
    name: Update nerv-base/homebrew-tap
    needs: [prepare, release]
    if: needs.prepare.outputs.draft == 'false' && needs.prepare.outputs.publish_brew == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        id: check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping automatic push to nerv-base/homebrew-tap. Formula/kiseki.rb is attached to the GitHub Release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download rendered Formula
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: dist/manifests

      - name: Checkout nerv-base/homebrew-tap
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: nerv-base/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit & push Formula/kiseki.rb
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p tap/Formula
          cp dist/manifests/kiseki.rb tap/Formula/kiseki.rb
          ruby -c tap/Formula/kiseki.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kiseki.rb
          if git diff --cached --quiet; then
            echo "Formula/kiseki.rb is already up to date."
          else
            git commit -m "kiseki ${{ needs.prepare.outputs.version }}"
            git push
          fi

  mirror-r2:
    name: Mirror Release to Cloudflare R2 (dl.kisekiterm.dev)
    needs: [prepare, build, release]
    if: needs.prepare.outputs.draft == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare R2 credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured; skipping R2 mirror."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          pattern: archive-*
          path: dist/archives
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          name: release-manifests
          path: dist/manifests

      - name: Upload release assets, dependencies, and installers to R2 (kiseki-dl)
        if: steps.check.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          printf '{"tag":"%s","version":"%s"}\n' "$TAG" "$VERSION" > dist/latest.json

          for f in dist/archives/kiseki-* dist/manifests/checksums.txt dist/manifests/deps.tsv; do
            name="$(basename "$f")"
            npx --yes wrangler@4 r2 object put "kiseki-dl/releases/${TAG}/${name}" \
              --file "$f" --cache-control "public, max-age=31536000, immutable" --remote
          done

          for s in scripts/install.sh scripts/install.ps1; do
            name="$(basename "$s")"
            npx --yes wrangler@4 r2 object put "kiseki-dl/releases/${TAG}/${name}" \
              --file "$s" --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=31536000, immutable" --remote
            npx --yes wrangler@4 r2 object put "kiseki-dl/${name}" \
              --file "$s" --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=60" --remote
          done

          npx --yes wrangler@4 r2 object put "kiseki-dl/releases/latest.json" \
            --file dist/latest.json --content-type "application/json" \
            --cache-control "public, max-age=60" --remote

          tmp_deps="$(mktemp -d)"
          trap 'rm -rf "$tmp_deps"' EXIT
          awk -F '\t' '$1 !~ /^#/ && NF == 6 { if (!seen[$4]++) print $3 "\t" $4 }' dist/manifests/deps.tsv |
          while IFS=$'\t' read -r url sha; do
            if curl -fsI --connect-timeout 5 --max-time 10 "https://dl.kisekiterm.dev/deps/${sha}" >/dev/null 2>&1; then
              echo "Skip existing deps/${sha}"
              continue
            fi
            dep_file="${tmp_deps}/${sha}"
            echo "Mirroring ${url} -> deps/${sha}"
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 300 "$url" -o "$dep_file"
            actual="$(sha256sum "$dep_file" | awk '{print $1}')"
            if [ "$actual" != "$sha" ]; then
              echo "SHA-256 mismatch for ${url}: expected ${sha}, got ${actual}" >&2
              exit 1
            fi
            npx --yes wrangler@4 r2 object put "kiseki-dl/deps/${sha}" \
              --file "$dep_file" --cache-control "public, max-age=31536000, immutable" --remote
            rm -f "$dep_file"
          done

          # Mirror upstream SIL OFL-1.1 license texts alongside mirrored font assets
          # so raw TTF / ZIP mirrors on R2 / EdgeOne satisfy OFL redistribution terms.
          cat > "${tmp_deps}/OFL-NOTICE.txt" <<'EOF'
          Kiseki Terminal Dependency Mirror — SIL Open Font License 1.1 Notices

          The font files mirrored under /deps/<sha256> are unmodified upstream releases
          distributed under the SIL Open Font License 1.1 (OFL-1.1):

          - JetBrains Mono Nerd Font (ryanoasis/nerd-fonts, JetBrains s.r.o.)
            License: /deps/licenses/OFL-JetBrainsMono.txt
            Upstream: https://github.com/ryanoasis/nerd-fonts
          - Departure Mono Nerd Font (ryanoasis/nerd-fonts, Helena Zhang)
            License: /deps/licenses/OFL-DepartureMono.txt
            Upstream: https://github.com/ryanoasis/nerd-fonts
          - Maple Mono NF CN (subframe7536/maple-font)
            License: /deps/licenses/OFL-MapleMono.txt
            Upstream: https://github.com/subframe7536/maple-font
          - Fusion Pixel 12px (TakWolf/fusion-pixel-font)
            License: /deps/licenses/OFL-FusionPixel.txt
            Upstream: https://github.com/TakWolf/fusion-pixel-font
          EOF
          npx --yes wrangler@4 r2 object put "kiseki-dl/deps/OFL-NOTICE.txt" \
            --file "${tmp_deps}/OFL-NOTICE.txt" --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=86400" --remote

          for pair in \
            "OFL-JetBrainsMono.txt|https://raw.githubusercontent.com/ryanoasis/nerd-fonts/v3.5.1/patched-fonts/JetBrainsMono/OFL.txt" \
            "OFL-DepartureMono.txt|https://raw.githubusercontent.com/ryanoasis/nerd-fonts/v3.5.1/patched-fonts/DepartureMono/OFL.txt" \
            "OFL-MapleMono.txt|https://raw.githubusercontent.com/subframe7536/maple-font/variable/OFL.txt" \
            "OFL-FusionPixel.txt|https://raw.githubusercontent.com/TakWolf/fusion-pixel-font/master/LICENSE-OFL.txt"; do
            lic_name="${pair%%|*}"
            lic_url="${pair#*|}"
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$lic_url" -o "${tmp_deps}/${lic_name}"; then
              npx --yes wrangler@4 r2 object put "kiseki-dl/deps/licenses/${lic_name}" \
                --file "${tmp_deps}/${lic_name}" --content-type "text/plain; charset=utf-8" \
                --cache-control "public, max-age=31536000, immutable" --remote
            else
              echo "::warning::Could not fetch upstream OFL license ${lic_url}"
            fi
          done
