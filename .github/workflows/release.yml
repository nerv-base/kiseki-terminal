name: Release

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0-alpha.1 or v2.0.0)"
        required: true
        type: string
      draft:
        description: "Keep GitHub Release as draft"
        required: false
        default: true
        type: boolean
      publish_npm:
        description: "Publish `kiseki-terminal` + 6 platform packages to npm"
        required: false
        default: false
        type: boolean
      publish_brew:
        description: "Update Formula/kiseki.rb in nerv-base/homebrew-tap"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      draft: ${{ steps.meta.outputs.draft }}
      publish_npm: ${{ steps.meta.outputs.publish_npm }}
      publish_brew: ${{ steps.meta.outputs.publish_brew }}
    steps:
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            DRAFT="${{ inputs.draft }}"
            PUBLISH_NPM="${{ inputs.publish_npm }}"
            PUBLISH_BREW="${{ inputs.publish_brew }}"
          else
            TAG="${GITHUB_REF_NAME}"
            DRAFT="false"
            PUBLISH_NPM="true"
            PUBLISH_BREW="true"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
            NPM_TAG="next"
          else
            PRERELEASE="false"
            NPM_TAG="latest"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "publish_npm=${PUBLISH_NPM}" >> "$GITHUB_OUTPUT"
          echo "publish_brew=${PUBLISH_BREW}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: kiseki
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: kiseki
            archive_ext: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: kiseki
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            bin: kiseki
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: kiseki.exe
            archive_ext: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            bin: kiseki.exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p kiseki-cli --target ${{ matrix.target }}

      - name: Sign and notarize macOS binary
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ -z "${MACOS_CERTIFICATE:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::notice::MACOS_CERTIFICATE not available; skipping Developer ID code signing and notarization."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/kiseki-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' signing identity found in imported certificate."
            exit 1
          fi
          echo "Signing $BIN with $IDENTITY..."
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ]; then
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            NOTARY_ZIP="$RUNNER_TEMP/kiseki-${{ matrix.target }}-notary.zip"
            ditto -c -k --keepParent "$BIN" "$NOTARY_ZIP"
            NOTARY_ARGS=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --wait)
            if [ -n "${APPLE_API_ISSUER:-}" ]; then
              NOTARY_ARGS+=(--issuer "$APPLE_API_ISSUER")
            fi
            echo "Submitting $NOTARY_ZIP to Apple notary service..."
            NOTARY_OUT="$RUNNER_TEMP/notary-result.json"
            xcrun notarytool submit "$NOTARY_ZIP" "${NOTARY_ARGS[@]}" --output-format json > "$NOTARY_OUT"
            cat "$NOTARY_OUT"
            STATUS="$(python3 -c "import json; print(json.load(open('$NOTARY_OUT')).get('status', ''))")"
            SUB_ID="$(python3 -c "import json; print(json.load(open('$NOTARY_OUT')).get('id', ''))")"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Apple notarization status was '$STATUS' (id=$SUB_ID)"
              if [ -n "$SUB_ID" ]; then
                xcrun notarytool log "$SUB_ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" ${APPLE_API_ISSUER:+--issuer "$APPLE_API_ISSUER"} || true
              fi
              rm -f "$RUNNER_TEMP/AuthKey.p8" "$NOTARY_ZIP" "$NOTARY_OUT"
              exit 1
            fi
            rm -f "$RUNNER_TEMP/AuthKey.p8" "$NOTARY_ZIP" "$NOTARY_OUT"
            echo "✓ Signed and notarized $BIN (submission $SUB_ID)"
          else
            echo "::notice::APPLE_API_KEY / APPLE_API_KEY_ID not set; binary is Developer ID signed but not notarized."
          fi

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/kiseki-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/kiseki-"*-notary.zip

      - name: Smoke test native binary
        if: |
          matrix.target == 'aarch64-apple-darwin' ||
          matrix.target == 'x86_64-unknown-linux-musl' ||
          matrix.target == 'aarch64-unknown-linux-musl' ||
          matrix.target == 'x86_64-pc-windows-msvc' ||
          matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: "./target/${{ matrix.target }}/release/${{ matrix.bin }} --version"

      - name: Package Unix archive (.tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          PKG="kiseki-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/archives" "dist/binaries/${{ matrix.target }}" "dist/stage/${PKG}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/binaries/${{ matrix.target }}/${{ matrix.bin }}"
          chmod +x "dist/binaries/${{ matrix.target }}/${{ matrix.bin }}"
          cp "dist/binaries/${{ matrix.target }}/${{ matrix.bin }}" "dist/stage/${PKG}/${{ matrix.bin }}"
          cp README.md LICENSE "dist/stage/${PKG}/"
          tar -C dist/stage -czf "dist/archives/${PKG}.tar.gz" "${PKG}"

      - name: Package Windows archive (.zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $target = "${{ matrix.target }}"
          $pkg = "kiseki-$tag-$target"
          New-Item -ItemType Directory -Force -Path "dist/archives", "dist/binaries/$target", "dist/stage/$pkg" | Out-Null
          Copy-Item "target/$target/release/${{ matrix.bin }}" "dist/binaries/$target/${{ matrix.bin }}"
          Copy-Item "dist/binaries/$target/${{ matrix.bin }}" "dist/stage/$pkg/${{ matrix.bin }}"
          Copy-Item README.md, LICENSE "dist/stage/$pkg/"
          Compress-Archive -Path "dist/stage/$pkg" -DestinationPath "dist/archives/$pkg.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/archives/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/binaries/${{ matrix.target }}/${{ matrix.bin }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release & Manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist/archives
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist/archives
          sha256sum kiseki-* | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Render Homebrew Formula & Scoop Manifest
        run: |
          mkdir -p dist/manifests
          node scripts/release/render-manifests.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --checksums dist/archives/checksums.txt \
            --brew-out dist/manifests/kiseki.rb \
            --scoop-out dist/manifests/kiseki.json \
            --repo "${{ github.repository }}"
          ruby -c dist/manifests/kiseki.rb
          node -e "JSON.parse(require('fs').readFileSync('dist/manifests/kiseki.json', 'utf8'))"

      - name: Upload manifests artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            dist/archives/checksums.txt
            dist/manifests/kiseki.rb
            dist/manifests/kiseki.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          DRAFT="${{ needs.prepare.outputs.draft }}"
          PRERELEASE="${{ needs.prepare.outputs.prerelease }}"
          SHA="${{ github.sha }}"

          cat > dist/RELEASE_NOTES.md <<EOF
          <p align="center">
            <img src="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/assets/hero-v2.png" alt="Kiseki Terminal v2" width="100%" />
          </p>

          ## Install

          - **Homebrew (macOS / Linux)**: \`brew install nerv-base/tap/kiseki\`
          - **npm / bun**: \`npm i -g kiseki-terminal\` · \`bun add -g kiseki-terminal\` · \`bunx kiseki-terminal\`
          - **Scoop (Windows)**: \`scoop install https://github.com/${{ github.repository }}/releases/download/${TAG}/kiseki.json\`
          - **Shell (macOS / Linux)**: \`curl -fsSL https://kisekiterm.dev/install.sh | KISEKI_VERSION=${TAG} sh\`
          - **PowerShell (Windows)**: \`& ([scriptblock]::Create((irm https://kisekiterm.dev/install.ps1))) -Version ${TAG}\`

          ### SHA-256 Checksums
          \`\`\`
          $(cat dist/archives/checksums.txt)
          \`\`\`
          EOF

          ASSETS=(
            dist/archives/kiseki-*
            dist/archives/checksums.txt
            dist/manifests/kiseki.rb
            dist/manifests/kiseki.json
            scripts/install.sh
            scripts/install.ps1
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
            if [ "$DRAFT" = "false" ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            FLAGS=(--title "${TAG} — Kiseki Terminal v2" --notes-file dist/RELEASE_NOTES.md --target "${{ github.ref_name }}")
            if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "${FLAGS[@]}" "${ASSETS[@]}"
          fi

  publish-npm:
    name: Publish npm / bun packages
    needs: [prepare, build, release]
    if: needs.prepare.outputs.draft == 'false' && needs.prepare.outputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download all 6 compiled binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/binaries-raw

      - name: Normalize binary directory layout
        run: |
          mkdir -p dist/binaries
          for dir in dist/binaries-raw/binary-*; do
            target="${dir##*/binary-}"
            mkdir -p "dist/binaries/${target}"
            cp -f "${dir}"/* "dist/binaries/${target}/"
          done
          ls -la dist/binaries/*

      - name: Stage npm packages
        run: |
          node scripts/release/stage-npm.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --binaries-dir dist/binaries \
            --out-dir dist/npm > dist/npm-manifest.json
          cat dist/npm-manifest.json

      - name: Smoke test staged Linux x64 wrapper
        run: |
          mkdir -p /tmp/kiseki-npm-smoke/node_modules
          cp -R dist/npm/kiseki-terminal-linux-x64 /tmp/kiseki-npm-smoke/node_modules/
          cp -R dist/npm/kiseki-terminal /tmp/kiseki-npm-smoke/node_modules/
          node /tmp/kiseki-npm-smoke/node_modules/kiseki-terminal/bin/kiseki.js --version

      - name: Publish platform packages & wrapper to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NPM_TAG="${{ needs.prepare.outputs.npm_tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN secret is not configured; attempting npm OIDC Trusted Publishing."
          fi
          while IFS= read -r dir; do
            pkg="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).name)" "$dir/package.json")"
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg}@${VERSION} (already published)"
              continue
            fi
            echo "Publishing ${pkg}@${VERSION} (tag=${NPM_TAG})..."
            npm publish "$dir" --access public --provenance --tag "$NPM_TAG"
          done < <(node -e "const m = JSON.parse(require('fs').readFileSync('dist/npm-manifest.json','utf8')); console.log(m.packages.map(p => p.dir).join('\n'));")

  publish-homebrew:
    name: Update nerv-base/homebrew-tap
    needs: [prepare, release]
    if: needs.prepare.outputs.draft == 'false' && needs.prepare.outputs.publish_brew == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        id: check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping automatic push to nerv-base/homebrew-tap. Formula/kiseki.rb is attached to the GitHub Release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download rendered Formula
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: dist/manifests

      - name: Checkout nerv-base/homebrew-tap
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: nerv-base/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit & push Formula/kiseki.rb
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p tap/Formula
          cp dist/manifests/kiseki.rb tap/Formula/kiseki.rb
          ruby -c tap/Formula/kiseki.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kiseki.rb
          if git diff --cached --quiet; then
            echo "Formula/kiseki.rb is already up to date."
          else
            git commit -m "kiseki ${{ needs.prepare.outputs.version }}"
            git push
          fi

  mirror-r2:
    name: Mirror Release to Cloudflare R2 (dl.kisekiterm.dev)
    needs: [prepare, build, release]
    if: needs.prepare.outputs.draft == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare R2 credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured; skipping R2 mirror."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          pattern: archive-*
          path: dist/archives
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          name: release-manifests
          path: dist/manifests

      - name: Upload release assets to R2 (kiseki-dl)
        if: steps.check.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          printf '{"tag":"%s","version":"%s"}\n' "$TAG" "$VERSION" > dist/latest.json

          for f in dist/archives/kiseki-* dist/manifests/checksums.txt scripts/install.sh scripts/install.ps1; do
            name="$(basename "$f")"
            npx --yes wrangler@4 r2 object put "kiseki-dl/releases/${TAG}/${name}" --file "$f" --remote
          done
          npx --yes wrangler@4 r2 object put "kiseki-dl/releases/latest.json" \
            --file dist/latest.json --content-type application/json \
            --cache-control "public, max-age=60" --remote
